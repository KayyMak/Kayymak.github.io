<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/css/site.css' | relative_url }}">
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-T2BJCNQP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
  </head>
  <body>
    <div class="site-page">
      <header class="home-header">
        <nav class="home-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}" {% if page.section == 'home' %}aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/about.html' | relative_url }}" {% if page.section == 'about' %}aria-current="page"{% endif %}>About</a>
          <a href="{{ '/experience.html' | relative_url }}" {% if page.section == 'experience' %}aria-current="page"{% endif %}>Experience</a>
          <a href="{{ '/projects.html' | relative_url }}" {% if page.section == 'projects' %}aria-current="page"{% endif %}>Projects</a>
          <a href="{{ '/activities.html' | relative_url }}" {% if page.section == 'activities' %}aria-current="page"{% endif %}>Activities</a>
        </nav>
        <a class="directory-link" href="{{ '/minimal.html' | relative_url }}">Directory view</a>
      </header>
      <main id="content" class="content">{{ content }}</main>
      <footer class="home-footer">
        <div class="home-contact" aria-label="Contact links">
          <a href="https://github.com/KayyMak" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://www.linkedin.com/in/olukayodem" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="mailto:olukayodemak@gmail.com" target="_blank" rel="noopener noreferrer">Email</a>
        </div>
      </footer>
    </div>
  </body>
</html>
