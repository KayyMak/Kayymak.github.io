<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="icon" type="image/png" href="{{ '/assets/images/geass-logo-transparent.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/site.css' | relative_url }}">
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-T2BJCNQP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
  </head>
  <body>
    <div class="site-page">
      <header class="home-header">
        <a class="site-mark" href="{{ '/' | relative_url }}" aria-label="Home"><img src="{{ '/assets/images/geass-logo-transparent.png' | relative_url }}" alt="" width="900" height="900"></a>
        <nav class="home-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}#projects">Work</a>
          <a href="{{ '/' | relative_url }}#experience">Experience</a>
          <a href="{{ '/' | relative_url }}#activities">Activities</a>
          <a href="{{ '/' | relative_url }}#contact">Contact</a>
        </nav>
        <a class="directory-link" href="{{ '/minimal.html' | relative_url }}">Directory view</a>
      </header>
      <main id="content" class="content">{{ content }}</main>
      <footer id="contact" class="home-footer">
        <div class="home-contact" aria-label="Contact links">
          <a href="https://github.com/KayyMak" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://www.linkedin.com/in/olukayodem" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="mailto:omakindeodusola@ucdavis.edu" target="_blank" rel="noopener noreferrer">Email</a>
        </div>
      </footer>
    </div>
  </body>
</html>
